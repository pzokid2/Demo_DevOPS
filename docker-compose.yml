# docker-compose.yml – cấu hình triển khai Juice Shop
# >>> BẢN CÓ LỖI dùng cho demo 1 (gate G1). Bản đã sửa: demo/fixes/docker-compose.yml <<<
name: juice-shop-cd

services:
  juice-shop:
    build: .
    image: juice-shop-cd:${IMAGE_TAG:-local}
    container_name: juice-shop-cd-lab
    restart: unless-stopped
    privileged: true                               # LỖI POL-02: toàn quyền trên host
    ports:
      - "3000:3000"                                # LỖI POL-03: publish ra 0.0.0.0
    environment:
      - DB_PASSWORD=SuperSecret123                 # LỖI POL-01: secret nằm trong file commit
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # LỖI POL-02: mount Docker socket

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: juice-shop-cd-nginx
    restart: unless-stopped
    depends_on: [juice-shop]
    ports:
      - "80:8080"                                  # LỖI POL-03: publish ra 0.0.0.0
    volumes:
      - ./deploy/nginx/juice-shop.conf:/etc/nginx/conf.d/default.conf:ro
