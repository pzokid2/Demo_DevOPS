# deploy/nginx/juice-shop.conf – reverse proxy cho Juice Shop (BẢN ĐÃ SỬA)
# Dùng chung cho stack tạm ở G4 và cho bản deploy thật.

map $http_upgrade $connection_upgrade {      # WebSocket cho socket.io
    default upgrade;
    ''      close;
}

server {
    listen 8080;                              # nginx-unprivileged không bind được cổng < 1024
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    client_max_body_size 5m;

    # ---- POL-03: chặn đường dẫn nội bộ của Juice Shop (vấn đề 4) ----
    # ~* = không phân biệt hoa thường, vì Express định tuyến không phân biệt hoa thường (/FTP vẫn vào được)
    location ~* ^/(ftp|support/logs|encryptionkeys|metrics)(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://juice-shop:3000;    # tên service trong mạng compose
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
