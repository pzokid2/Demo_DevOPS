# deploy/nginx/juice-shop.conf – reverse proxy cho Juice Shop
# >>> BẢN CÓ LỖI dùng cho demo 4 (gate G4): chuyển tiếp MỌI đường dẫn, kể cả /ftp <<<
# Bản đã sửa: demo/fixes/deploy/nginx/juice-shop.conf
# Dùng chung cho stack tạm ở G4 và cho bản deploy thật.

map $http_upgrade $connection_upgrade {      # WebSocket cho socket.io
    default upgrade;
    ''      close;
}

server {
    listen 8080;                              # nginx-unprivileged không bind được cổng < 1024
    server_name _;
    server_tokens off;

    client_max_body_size 5m;

    location / {
        proxy_pass http://juice-shop:3000;    # tên service trong mạng compose
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
